services:
  postgres:
    image: postgres:16
    container_name: lpr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: learning_path_recommender
      POSTGRES_USER: lprdev
      POSTGRES_PASSWORD: lprdevpass
    ports:
      - "5432:5432"
    volumes:
      - lpr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lprdev -d learning_path_recommender" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lpr_pgdata:
